# Compiler settings mirror Circle's buidl-wallet-contracts exactly. The ported plugin is
# installed into their MSCA and must agree with it on solc version, EVM target and IR
# pipeline; drifting here is how a manifest hash or an immutable stops matching.
[profile.default]
src = 'src'
out = 'out'
test = 'test'
libs = ['lib', 'node_modules']
solc_version = "0.8.24"
evm_version = 'paris'
optimizer = true
optimizer_runs = 200
via_ir = true
auto_detect_solc = false
auto_detect_remappings = false

[fmt]
line_length = 120
wrap_comments = true
sort_imports = true

# Forked tests run against the real Circle deployment on Arc rather than a local rebuild of it.
[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
